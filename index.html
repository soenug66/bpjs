<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cetak Kartu Indonesia Sehat</title>

  <!-- Library pdf-lib untuk PDF -->
  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <!-- Library bwip-js untuk Barcode -->
  <script src="https://cdn.jsdelivr.net/npm/bwip-js@3.0.4/dist/bwip-js-min.js"></script>

  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      max-width: 480px;
      margin: 30px auto;
      padding: 25px;
      background-color: #f4f6f9;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      border-radius: 8px;
    }
    h2 { text-align: center; color: #00875a; margin-bottom: 20px; }
    .form-group { margin-bottom: 12px; }
    label { display: block; margin-bottom: 4px; font-weight: bold; color: #333; font-size: 14px; }
    input[type="text"] {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 14px;
    }
    button {
      width: 100%;
      padding: 12px;
      background-color: #00875a;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }
    button:hover { background-color: #006644; }
    #status { margin-top: 15px; text-align: center; font-weight: bold; }
    #barcodeCanvas { display: none; }
  </style>
</head>
<body>

  <h2>Form Cetak Kartu KIS</h2>

  <form id="cardForm">
    <div class="form-group">
      <label for="noKartu">Nomor Kartu (Barcode):</label>
      <input type="text" id="noKartu" value="0001031973028" required>
    </div>

    <div class="form-group">
      <label for="nama">Nama Lengkap:</label>
      <input type="text" id="nama" value="TARYANTO" required>
    </div>

    <div class="form-group">
      <label for="alamat">Alamat:</label>
      <input type="text" id="alamat" value="RANDEGAN 04/03 RANDEGAN, LOSARI" required>
    </div>

    <div class="form-group">
      <label for="tglLahir">Tanggal Lahir:</label>
      <input type="text" id="tglLahir" value="27-08-1952" required>
    </div>

    <div class="form-group">
      <label for="nik">NIK:</label>
      <input type="text" id="nik" value="33291722708520002" required>
    </div>

    <div class="form-group">
      <label for="faskes">Faskes Tingkat I:</label>
      <input type="text" id="faskes" value="Bojongsari" required>
    </div>

    <button type="button" onclick="generatePDF()">Cetak Kartu PDF</button>
  </form>

  <div id="status"></div>
  <canvas id="barcodeCanvas"></canvas>

  <script>
    async function generatePDF() {
      const noKartu = document.getElementById('noKartu').value.trim();
      const nama = document.getElementById('nama').value.trim();
      const alamat = document.getElementById('alamat').value.trim();
      const tglLahir = document.getElementById('tglLahir').value.trim();
      const nik = document.getElementById('nik').value.trim();
      const faskes = document.getElementById('faskes').value.trim();
      const statusDiv = document.getElementById('status');

      if (!noKartu || !nama) {
        alert('Mohon lengkapi data form!');
        return;
      }

      statusDiv.style.color = '#00875a';
      statusDiv.innerText = 'Memproses Kartu PDF...';

      try {
        const response = await fetch('./template.pdf');
        if (!response.ok) throw new Error('File template.pdf tidak ditemukan.');
        const pdfArrayBuffer = await response.arrayBuffer();

        const pdfDoc = await PDFLib.PDFDocument.load(pdfArrayBuffer);
        const fontRegular = await pdfDoc.embedFont(PDFLib.StandardFonts.Helvetica);
        const fontBold = await pdfDoc.embedFont(PDFLib.StandardFonts.HelveticaBold);

        const firstPage = pdfDoc.getPages()[0];
        const black = PDFLib.rgb(0, 0, 0);

        // --- KOORDINAT PRESISI (Sistem Koordinat PDF: Y dihitung dari BAWAH) ---
        // X = 138 (Jarak pas dari pinggir kiri, menimpa persis di sebelah titik dua)
        
        // 1. Nomor Kartu (Helvetica Bold, 11 pt)
        firstPage.drawText(noKartu, { x: 138, y: 128, size: 11, font: fontBold, color: black });

        // 2. Nama Lengkap (Helvetica Bold, 11 pt)
        firstPage.drawText(nama.toUpperCase(), { x: 138, y: 112, size: 11, font: fontBold, color: black });

        // 3. Alamat (Helvetica Regular, 11 pt)
        firstPage.drawText(alamat.toUpperCase(), { x: 138, y: 96, size: 11, font: fontRegular, color: black });

        // 4. Tanggal Lahir (Helvetica Regular, 11 pt)
        firstPage.drawText(tglLahir, { x: 138, y: 80, size: 11, font: fontRegular, color: black });

        // 5. NIK (Helvetica Regular, 11 pt)
        firstPage.drawText(nik, { x: 138, y: 64, size: 11, font: fontRegular, color: black });

        // 6. Faskes Tingkat I (Helvetica Regular, 11 pt)
        firstPage.drawText(faskes, { x: 138, y: 48, size: 11, font: fontRegular, color: black });

        // --- GENERATE BARCODE (732 px x 88 px) ---
        const canvas = document.getElementById('barcodeCanvas');
        bwipjs.toCanvas(canvas, {
          bcid: 'code128',
          text: noKartu,
          width: 732 / 10,
          height: 88 / 10,
          includetext: false,
        });

        const barcodeDataUrl = canvas.toDataURL('image/png');
        const barcodeImage = await pdfDoc.embedPng(barcodeDataUrl);

        // Posisi Barcode berada tepat di bawah tulisan Faskes
        firstPage.drawImage(barcodeImage, {
          x: 138,       
          y: 22,        
          width: 135,   
          height: 16.2, 
        });

        const pdfBytes = await pdfDoc.save();
        const blob = new Blob([pdfBytes], { type: 'application/pdf' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `Kartu_KIS_${nama.replace(/\s+/g, '_')}.pdf`;
        link.click();

        statusDiv.style.color = 'green';
        statusDiv.innerText = 'Kartu Berhasil Dibuat!';
      } catch (error) {
        console.error(error);
        statusDiv.style.color = 'red';
        statusDiv.innerText = 'Gagal: ' + error.message;
      }
    }
  </script>
</body>
</html>
